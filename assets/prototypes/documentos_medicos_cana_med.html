<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Documentos | Cana Med</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        cana: {
                            light: '#e0f2f1',
                            DEFAULT: '#00695c', // Cor institucional principal (Verde/Teal Médico)
                            dark: '#004d40',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        /* Estilos específicos para a página A4 e Impressão */
        :root {
            --page-width: 210mm;
            --page-height: 297mm;
        }

        body {
            background-color: #f3f4f6;
            -webkit-font-smoothing: antialiased;
        }

        /* Container que simula a folha A4 na tela */
        .a4-page {
            width: var(--page-width);
            min-height: var(--page-height);
            padding: 20mm;
            margin: 2rem auto;
            background: white;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            position: relative;
            display: flex;
            flex-direction: column;
        }

        /* Evita que blocos de medicamentos/exames quebrem no meio durante a impressão */
        .avoid-page-break {
            page-break-inside: avoid;
            break-inside: avoid;
        }

        /* Regras estritas de impressão */
        @media print {
            @page {
                size: A4;
                margin: 0;
            }
            body {
                background: white;
                margin: 0;
                padding: 0;
            }
            .no-print {
                display: none !important;
            }
            .a4-page {
                margin: 0;
                padding: 15mm 20mm;
                box-shadow: none;
                border: none;
                width: 100%;
                min-height: 100vh;
                page-break-after: always;
            }
            /* Garante que cores de fundo e bordas sejam impressas */
            * {
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }
        }

        /* Rodapé fixo na base da folha visualmente */
        .doc-footer {
            margin-top: auto;
            padding-top: 2rem;
        }
    </style>
</head>
<body class="flex flex-col md:flex-row min-h-screen">

    <!-- PAINEL DE CONTROLE (Não é impresso) -->
    <aside class="no-print w-full md:w-80 bg-white border-r border-gray-200 p-6 flex flex-col shadow-sm z-10 sticky top-0 h-screen overflow-y-auto">
        <div class="flex items-center gap-3 mb-8">
            <div class="w-8 h-8 rounded bg-cana flex items-center justify-center text-white font-bold text-xl">
                C
            </div>
            <h1 class="text-xl font-bold text-gray-800">Cana Med</h1>
        </div>

        <h2 class="text-sm font-semibold text-gray-500 uppercase tracking-wider mb-4">Gerador de Documentos</h2>
        
        <div class="space-y-3 mb-8">
            <button onclick="loadTemplate('receita')" id="btn-receita" class="w-full text-left px-4 py-3 rounded-lg border-2 border-cana bg-cana-light text-cana-dark font-medium transition-colors">
                Receita Médica
            </button>
            <button onclick="loadTemplate('exames')" id="btn-exames" class="w-full text-left px-4 py-3 rounded-lg border border-gray-200 hover:border-cana text-gray-700 font-medium transition-colors">
                Solicitação de Exames
            </button>
        </div>

        <div class="bg-blue-50 border border-blue-100 rounded-lg p-4 mb-8">
            <h3 class="text-sm font-semibold text-blue-800 mb-1">Aviso de Conformidade</h3>
            <p class="text-xs text-blue-600 leading-relaxed">
                Este preview utiliza dados mockados validados em estrutura. Em produção, garanta que a API aplique filtros de LGPD antes de preencher a view.
            </p>
        </div>

        <div class="mt-auto space-y-3">
            <button onclick="window.print()" class="w-full bg-cana hover:bg-cana-dark text-white font-semibold py-3 px-4 rounded-lg shadow transition-colors flex items-center justify-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z" />
                </svg>
                Imprimir / Salvar PDF
            </button>
        </div>
    </aside>

    <!-- ÁREA DE VISUALIZAÇÃO DO DOCUMENTO -->
    <main class="flex-1 overflow-y-auto bg-gray-100 w-full relative">
        <div id="document-render-area">
            <!-- O conteúdo do A4 será injetado aqui via JS -->
        </div>
    </main>

    <!-- TEMPLATES JAVASCRIPT -->
    <script>
        // DADOS MOCKADOS (Simulando resposta estruturada do backend)
        const clinicData = {
            name: "Cana Med - Unidade Boa Viagem",
            address: "Av. Engenheiro Domingos Ferreira, 1000 - Boa Viagem, Recife - PE",
            contact: "(81) 3000-0000 | contato@canamed.com.br",
            logoChar: "C"
        };

        const doctorData = {
            name: "Dr. Carlos Eduardo Silveira",
            specialty: "Clínico Geral",
            crm: "CRM-PE 12345",
            signatureDate: new Date().toLocaleDateString('pt-BR')
        };

        const patientData = {
            name: "Mariana Costa Albuquerque",
            dob: "14/08/1990",
            id: "PAC-88392"
        };

        const prescriptionData = {
            id: "REC-2026-0984",
            medications: [
                {
                    name: "Amoxicilina + Clavulanato de Potássio",
                    concentration: "875mg + 125mg",
                    form: "Comprimido Revestido",
                    posology: "Tomar 1 comprimido por via oral a cada 12 horas.",
                    duration: "10 dias",
                    quantity: "2 caixas",
                    route: "Uso Oral",
                    instructions: "Tomar preferencialmente no início das refeições para minimizar desconforto gástrico."
                },
                {
                    name: "Dipirona Monoidratada",
                    concentration: "500 mg/mL",
                    form: "Solução Gotas",
                    posology: "Tomar 35 gotas diluídas em água a cada 6 horas.",
                    duration: "Se necessário (em caso de dor ou febre)",
                    quantity: "1 frasco",
                    route: "Uso Oral",
                    instructions: "Não ultrapassar a dose máxima diária recomendada."
                }
            ],
            complementaryInfo: "Manter repouso nos próximos 3 dias. Aumentar a ingestão de líquidos."
        };

        const examData = {
            id: "EXM-2026-1102",
            exams: [
                {
                    name: "Hemograma Completo",
                    specs: "Série vermelha, série branca e plaquetas",
                    justification: "Avaliação de quadro infeccioso agudo."
                },
                {
                    name: "Proteína C Reativa (PCR)",
                    specs: "Ultrassensível",
                    justification: "Avaliação de atividade inflamatória."
                },
                {
                    name: "Raio-X de Tórax",
                    specs: "Incidências PA e Perfil",
                    justification: "Investigação de tosse persistente e dispneia."
                }
            ],
            observations: "Paciente deverá realizar os exames laboratoriais com jejum mínimo de 8 horas."
        };

        // FUNÇÕES DE RENDERIZAÇÃO
        function renderHeader(docId) {
            return `
                <header class="flex justify-between items-start border-b-2 border-cana pb-4 mb-6">
                    <div class="flex items-center gap-4">
                        <div class="w-14 h-14 rounded bg-cana flex items-center justify-center text-white font-bold text-3xl">
                            ${clinicData.logoChar}
                        </div>
                        <div>
                            <h2 class="text-xl font-bold text-gray-800">${clinicData.name}</h2>
                            <p class="text-xs text-gray-600">${clinicData.address}</p>
                            <p class="text-xs text-gray-600">${clinicData.contact}</p>
                        </div>
                    </div>
                    <div class="text-right">
                        <p class="font-bold text-gray-800">${doctorData.name}</p>
                        <p class="text-sm text-gray-600">${doctorData.specialty}</p>
                        <p class="text-sm text-cana font-semibold">${doctorData.crm}</p>
                        <p class="text-xs text-gray-400 mt-1">ID: ${docId}</p>
                    </div>
                </header>
            `;
        }

        function renderPatientInfo() {
            return `
                <div class="bg-gray-50 rounded p-4 mb-6 border border-gray-100 flex justify-between items-center">
                    <div>
                        <p class="text-xs text-gray-500 uppercase tracking-wider font-semibold mb-1">Paciente</p>
                        <p class="font-bold text-gray-800 text-lg">${patientData.name}</p>
                    </div>
                    <div class="text-right">
                        <p class="text-xs text-gray-500 uppercase tracking-wider font-semibold mb-1">Nascimento</p>
                        <p class="font-medium text-gray-800">${patientData.dob}</p>
                    </div>
                </div>
            `;
        }

        function renderFooter() {
            return `
                <footer class="doc-footer avoid-page-break">
                    <div class="flex flex-col items-center justify-center pt-8 mt-8 border-t border-gray-200">
                        <div class="w-64 border-b border-gray-800 mb-2"></div>
                        <p class="font-bold text-gray-800">${doctorData.name}</p>
                        <p class="text-sm text-gray-600">${doctorData.crm}</p>
                    </div>
                    <div class="text-center mt-8 text-xs text-gray-400">
                        <p>Documento emitido em ${doctorData.signatureDate} pelo sistema Cana Med.</p>
                        <p>A validade deste documento obedece à legislação vigente.</p>
                    </div>
                </footer>
            `;
        }

        function renderReceita() {
            let html = `
                <div class="a4-page">
                    ${renderHeader(prescriptionData.id)}
                    ${renderPatientInfo()}
                    
                    <div class="text-center mb-8">
                        <h1 class="text-2xl font-bold tracking-widest text-gray-800 border-b border-gray-300 inline-block pb-1 px-4">
                            RECEITA MÉDICA
                        </h1>
                    </div>

                    <div class="space-y-6 flex-1">
            `;

            prescriptionData.medications.forEach((med, index) => {
                html += `
                    <div class="avoid-page-break mb-6">
                        <div class="flex justify-between items-baseline mb-2">
                            <h3 class="text-lg font-bold text-gray-800">
                                <span class="text-cana mr-1">${index + 1}.</span> 
                                ${med.name} <span class="text-sm font-normal text-gray-600">${med.concentration} - ${med.form}</span>
                            </h3>
                            <span class="text-sm font-bold bg-gray-100 px-2 py-1 rounded text-gray-700">${med.quantity}</span>
                        </div>
                        <div class="pl-6 border-l-2 border-cana-light ml-2">
                            <p class="text-sm text-gray-800 mb-1"><strong class="text-gray-600">Uso:</strong> ${med.route}</p>
                            <p class="text-sm text-gray-800 mb-1"><strong class="text-gray-600">Posologia:</strong> ${med.posology} (${med.duration})</p>
                            ${med.instructions ? `<p class="text-sm text-gray-600 italic mt-2">Orientação: ${med.instructions}</p>` : ''}
                        </div>
                    </div>
                `;
            });

            if (prescriptionData.complementaryInfo) {
                html += `
                    <div class="avoid-page-break mt-10 bg-cana-light/30 p-4 rounded border-l-4 border-cana">
                        <h4 class="text-sm font-bold text-cana-dark uppercase mb-2">Orientações Complementares</h4>
                        <p class="text-sm text-gray-700">${prescriptionData.complementaryInfo}</p>
                    </div>
                `;
            }

            html += `
                    </div>
                    ${renderFooter()}
                </div>
            `;
            return html;
        }

        function renderSolicitacaoExames() {
            let html = `
                <div class="a4-page">
                    ${renderHeader(examData.id)}
                    ${renderPatientInfo()}
                    
                    <div class="text-center mb-8">
                        <h1 class="text-2xl font-bold tracking-widest text-gray-800 border-b border-gray-300 inline-block pb-1 px-4">
                            SOLICITAÇÃO DE EXAMES
                        </h1>
                    </div>

                    <div class="space-y-4 flex-1">
            `;

            examData.exams.forEach((exam, index) => {
                html += `
                    <div class="avoid-page-break py-3 border-b border-gray-100 last:border-0">
                        <div class="flex items-start">
                            <span class="text-cana font-bold mr-3 mt-0.5">${index + 1}.</span>
                            <div>
                                <h3 class="text-base font-bold text-gray-800">${exam.name}</h3>
                                ${exam.specs ? `<p class="text-sm text-gray-600">${exam.specs}</p>` : ''}
                                ${exam.justification ? `<p class="text-xs text-gray-500 mt-1"><span class="font-semibold">Indicação Clínica:</span> ${exam.justification}</p>` : ''}
                            </div>
                        </div>
                    </div>
                `;
            });

            if (examData.observations) {
                html += `
                    <div class="avoid-page-break mt-8 pt-4 border-t border-dashed border-gray-300">
                        <h4 class="text-sm font-bold text-gray-800 mb-2">Observações / Preparo:</h4>
                        <p class="text-sm text-gray-700">${examData.observations}</p>
                    </div>
                `;
            }

            html += `
                    </div>
                    ${renderFooter()}
                </div>
            `;
            return html;
        }

        // Lógica de UI para alternar templates
        function loadTemplate(type) {
            const container = document.getElementById('document-render-area');
            const btnReceita = document.getElementById('btn-receita');
            const btnExames = document.getElementById('btn-exames');

            // Resetar estilos dos botões
            btnReceita.className = "w-full text-left px-4 py-3 rounded-lg border border-gray-200 hover:border-cana text-gray-700 font-medium transition-colors";
            btnExames.className = "w-full text-left px-4 py-3 rounded-lg border border-gray-200 hover:border-cana text-gray-700 font-medium transition-colors";

            if (type === 'receita') {
                container.innerHTML = renderReceita();
                btnReceita.className = "w-full text-left px-4 py-3 rounded-lg border-2 border-cana bg-cana-light text-cana-dark font-medium transition-colors";
            } else {
                container.innerHTML = renderSolicitacaoExames();
                btnExames.className = "w-full text-left px-4 py-3 rounded-lg border-2 border-cana bg-cana-light text-cana-dark font-medium transition-colors";
            }
        }

        // Inicializar com Receita Médica
        window.onload = () => {
            loadTemplate('receita');
        };
    </script>
</body>
</html>
