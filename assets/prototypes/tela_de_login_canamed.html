<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | CANA MED Mulher</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#fff1f2',
                            100: '#ffe4e6',
                            200: '#fecdd3',
                            300: '#fda4af',
                            400: '#fb7185',
                            500: '#f43f5e',
                            600: '#e11d48', // Cor primária principal
                            700: '#be123c',
                            800: '#9f1239',
                            900: '#881337',
                        }
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.4s ease-out forwards',
                        'slide-up': 'slideUp 0.5s ease-out forwards',
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0' },
                            '100%': { opacity: '1' },
                        },
                        slideUp: {
                            '0%': { opacity: '0', transform: 'translateY(10px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; }
        .glass-panel {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        .bg-pattern {
            background-color: #fdf2f8;
            background-image: radial-gradient(#fda4af 0.5px, transparent 0.5px), radial-gradient(#fda4af 0.5px, #fdf2f8 0.5px);
            background-size: 20px 20px;
            background-position: 0 0, 10px 10px;
        }
        /* Custom scrollbar for better look */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="bg-gray-50 text-slate-900 h-screen w-full overflow-hidden">
    <div id="root" class="h-full w-full"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const Icons = {
            Patient: () => (
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
            ),
            Doctor: () => (
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M4.8 2.3A.3.3 0 1 0 5 2H4a2 2 0 0 0-2 2v5a6 6 0 0 0 6 6v0a6 6 0 0 0 6-6V4a2 2 0 0 0-2-2h-1a.2.2 0 1 0 .3.3"/><path d="M8 15v1a6 6 0 0 0 6 6v0a6 6 0 0 0 6-6v-4"/><circle cx="20" cy="10" r="2"/></svg>
            ),
            Admin: () => (
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M3 9h18"/><path d="M9 21V9"/></svg>
            ),
            Logo: () => (
                <svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect width="40" height="40" rx="12" fill="#E11D48"/>
                    <path d="M20 10C20 10 13 14 13 21C13 24.866 16.134 28 20 28C23.866 28 27 24.866 27 21C27 14 20 10 20 10Z" fill="white" fillOpacity="0.9"/>
                    <path d="M20 17V25M16 21H24" stroke="#E11D48" strokeWidth="2" strokeLinecap="round"/>
                </svg>
            ),
            Eye: () => (
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
            ),
            EyeOff: () => (
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" x2="22" y1="2" y2="22"/></svg>
            ),
            ArrowLeft: () => (
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
            ),
            CheckCircle: () => (
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" class="text-green-500"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="m9 11 3 3L22 4"/></svg>
            ),
            AlertCircle: () => (
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" class="text-brand-600"><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></svg>
            ),
            Loader: () => (
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" class="animate-spin"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>
            )
        };

        const PROFILES = [
            {
                id: 'paciente',
                title: 'Sou paciente',
                desc: 'Acesse suas consultas e informações pessoais.',
                icon: Icons.Patient,
                btnText: 'Entrar como paciente',
                colorType: 'brand',
                bgIcon: 'bg-brand-50',
                textIcon: 'text-brand-600',
                identifierLabel: 'E-mail ou CPF',
                identifierPlaceholder: 'Digite seu e-mail ou CPF'
            },
            {
                id: 'medico',
                title: 'Sou médica(o)',
                desc: 'Gerencie sua agenda e acompanhe seus atendimentos.',
                icon: Icons.Doctor,
                btnText: 'Entrar como médico',
                colorType: 'teal',
                bgIcon: 'bg-teal-50',
                textIcon: 'text-teal-600',
                identifierLabel: 'E-mail profissional',
                identifierPlaceholder: 'dr@clinica.com.br'
            },
            {
                id: 'admin',
                title: 'Sou da equipe da clínica',
                desc: 'Acesse a gestão de consultas e as operações da clínica.',
                icon: Icons.Admin,
                btnText: 'Entrar na administração',
                colorType: 'indigo',
                bgIcon: 'bg-indigo-50',
                textIcon: 'text-indigo-600',
                identifierLabel: 'E-mail corporativo',
                identifierPlaceholder: 'recepcao@clinica.com.br'
            }
        ];

        const RoleSelector = ({ onSelect }) => {
            return (
                <div class="w-full max-w-md animate-fade-in">
                    <div class="mb-10 text-center md:text-left">
                        <h2 class="text-3xl font-bold text-slate-900 tracking-tight mb-3">Bem-vinda ao CANA MED Mulher</h2>
                        <p class="text-slate-500 text-lg">Escolha como deseja acessar a plataforma.</p>
                    </div>

                    <div class="space-y-4">
                        {PROFILES.map((profile, idx) => (
                            <button 
                                key={profile.id}
                                onClick={() => onSelect(profile)}
                                class={`w-full group flex items-start p-5 bg-white border border-slate-200 rounded-2xl hover:border-brand-400 hover:shadow-md transition-all duration-300 text-left`}
                                style={{ animationDelay: `${idx * 100}ms` }}
                            >
                                <div class={`flex-shrink-0 w-12 h-12 rounded-xl flex items-center justify-center ${profile.bgIcon} ${profile.textIcon} group-hover:scale-110 transition-transform duration-300`}>
                                    <profile.icon />
                                </div>
                                <div class="ml-5">
                                    <h3 class="text-lg font-semibold text-slate-800 group-hover:text-brand-600 transition-colors">{profile.title}</h3>
                                    <p class="text-sm text-slate-500 mt-1 leading-relaxed">{profile.desc}</p>
                                </div>
                            </button>
                        ))}
                    </div>
                    
                    <div class="mt-10 text-center md:text-left border-t border-slate-100 pt-6">
                        <a href="#" class="text-sm text-slate-500 hover:text-brand-600 transition-colors inline-flex items-center gap-1 font-medium">
                            Precisa de ajuda para acessar?
                        </a>
                    </div>
                </div>
            );
        };

        const LoginForm = ({ profile, onBack }) => {
            const [showPassword, setShowPassword] = useState(false);
            const [status, setStatus] = useState('idle'); // idle, loading, success, error
            const [identifier, setIdentifier] = useState('');
            const [password, setPassword] = useState('');

            const handleSubmit = (e) => {
                e.preventDefault();
                if(!identifier || !password) {
                    setStatus('error');
                    return;
                }

                setStatus('loading');
                
                // Simulação de delay de rede
                setTimeout(() => {
                    // Simulação básica: se a senha for 'erro', mostra estado de erro.
                    if(password === 'erro') {
                        setStatus('error');
                    } else {
                        setStatus('success');
                    }
                }, 1500);
            };

            return (
                <div class="w-full max-w-md animate-slide-up">
                    <button 
                        onClick={onBack}
                        class="mb-8 text-sm font-medium text-slate-500 hover:text-slate-900 transition-colors flex items-center gap-2 group"
                    >
                        <span class="group-hover:-translate-x-1 transition-transform"><Icons.ArrowLeft /></span>
                        Voltar para seleção
                    </button>

                    <div class="mb-8 flex items-center gap-4">
                        <div class={`w-14 h-14 rounded-2xl flex items-center justify-center ${profile.bgIcon} ${profile.textIcon}`}>
                            <profile.icon />
                        </div>
                        <div>
                            <h2 class="text-2xl font-bold text-slate-900">Acesso {profile.title.replace('Sou ', '').toLowerCase()}</h2>
                            <p class="text-slate-500 text-sm mt-1">Insira suas credenciais para continuar</p>
                        </div>
                    </div>

                    {status === 'success' ? (
                        <div class="bg-green-50 border border-green-200 rounded-2xl p-6 text-center animate-fade-in">
                            <div class="flex justify-center mb-4"><Icons.CheckCircle /></div>
                            <h3 class="text-green-800 font-semibold text-lg mb-2">Autenticação bem-sucedida!</h3>
                            <p class="text-green-600 text-sm">Redirecionando para o seu painel...</p>
                        </div>
                    ) : (
                        <form onSubmit={handleSubmit} class="space-y-5">
                            {status === 'error' && (
                                <div class="bg-brand-50 border border-brand-200 text-brand-700 p-4 rounded-xl text-sm flex items-start gap-3 animate-fade-in">
                                    <Icons.AlertCircle />
                                    <span>As credenciais informadas estão incorretas ou incompletas. Tente novamente.</span>
                                </div>
                            )}

                            <div>
                                <label class="block text-sm font-medium text-slate-700 mb-2">{profile.identifierLabel}</label>
                                <input 
                                    type="text" 
                                    value={identifier}
                                    onChange={(e) => setIdentifier(e.target.value)}
                                    placeholder={profile.identifierPlaceholder}
                                    class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:border-brand-500 focus:ring-4 focus:ring-brand-500/20 outline-none transition-all bg-white"
                                    disabled={status === 'loading'}
                                />
                            </div>

                            <div>
                                <div class="flex justify-between items-center mb-2">
                                    <label class="block text-sm font-medium text-slate-700">Senha</label>
                                    <a href="#" class="text-sm font-medium text-brand-600 hover:text-brand-800 transition-colors">
                                        Esqueci minha senha
                                    </a>
                                </div>
                                <div class="relative">
                                    <input 
                                        type={showPassword ? 'text' : 'password'} 
                                        value={password}
                                        onChange={(e) => setPassword(e.target.value)}
                                        placeholder="••••••••"
                                        class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:border-brand-500 focus:ring-4 focus:ring-brand-500/20 outline-none transition-all bg-white pr-12"
                                        disabled={status === 'loading'}
                                    />
                                    <button 
                                        type="button"
                                        onClick={() => setShowPassword(!showPassword)}
                                        class="absolute right-3 top-1/2 -translate-y-1/2 p-1 text-slate-400 hover:text-slate-600 transition-colors outline-none"
                                        aria-label={showPassword ? "Ocultar senha" : "Mostrar senha"}
                                    >
                                        {showPassword ? <Icons.EyeOff /> : <Icons.Eye />}
                                    </button>
                                </div>
                            </div>

                            <button 
                                type="submit" 
                                disabled={status === 'loading'}
                                class={`w-full py-3.5 px-4 rounded-xl text-white font-medium shadow-sm hover:shadow-md transition-all flex items-center justify-center gap-2 ${status === 'loading' ? 'bg-brand-400 cursor-not-allowed' : 'bg-brand-600 hover:bg-brand-700'}`}
                            >
                                {status === 'loading' ? (
                                    <><Icons.Loader /> Autenticando...</>
                                ) : (
                                    profile.btnText
                                )}
                            </button>
                            
                            {profile.id === 'paciente' && (
                                <p class="text-center text-sm text-slate-500 mt-6">
                                    Primeira vez aqui? <a href="#" class="text-brand-600 font-medium hover:underline">Solicite acesso à sua clínica</a>
                                </p>
                            )}
                        </form>
                    )}
                </div>
            );
        };

        const App = () => {
            const [view, setView] = useState('selection'); // 'selection' | 'login'
            const [selectedProfile, setSelectedProfile] = useState(null);

            const handleSelectProfile = (profile) => {
                setSelectedProfile(profile);
                setView('login');
            };

            const handleBack = () => {
                setView('selection');
                setTimeout(() => setSelectedProfile(null), 300); // Wait for transition
            };

            return (
                <div class="flex h-screen w-full bg-white relative overflow-hidden">
                    
                    {/* Painel Esquerdo (Institucional) - Escondido no Mobile */}
                    <div class="hidden lg:flex lg:w-[45%] xl:w-1/2 bg-pattern relative flex-col justify-between p-12 overflow-hidden border-r border-brand-100/50">
                        {/* Abstract Background Shapes */}
                        <div class="absolute top-0 left-0 w-full h-full overflow-hidden z-0">
                            <div class="absolute -top-[20%] -left-[10%] w-[70%] h-[70%] rounded-full bg-gradient-to-br from-brand-300/40 to-brand-100/10 blur-3xl"></div>
                            <div class="absolute bottom-[10%] -right-[20%] w-[80%] h-[80%] rounded-full bg-gradient-to-tl from-purple-300/20 to-brand-200/20 blur-3xl"></div>
                        </div>

                        <div class="relative z-10">
                            <div class="flex items-center gap-3">
                                <Icons.Logo />
                                <span class="text-2xl font-bold tracking-tight text-brand-900">CANA MED <span class="font-light">Mulher</span></span>
                            </div>
                        </div>

                        <div class="relative z-10 max-w-lg">
                            <span class="inline-block py-1.5 px-3 rounded-full bg-white/60 border border-brand-200 text-brand-700 text-xs font-semibold tracking-wide uppercase mb-6 shadow-sm">
                                Plataforma de Gestão Clínica
                            </span>
                            <h1 class="text-4xl xl:text-5xl font-bold text-slate-900 leading-[1.15] mb-6 tracking-tight">
                                Cuidado conectado,<br/>
                                <span class="text-brand-600">gestão inteligente.</span>
                            </h1>
                            <p class="text-lg text-slate-600 leading-relaxed mb-10">
                                Uma experiência acolhedora e profissional, desenvolvida exclusivamente para a saúde da mulher. Conectando pacientes, médicas e clínicas em um só lugar.
                            </p>
                            
                            <div class="glass-panel p-6 rounded-2xl flex items-start gap-4">
                                <div class="w-10 h-10 rounded-full bg-brand-100 flex items-center justify-center flex-shrink-0">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" class="text-brand-600"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
                                </div>
                                <div>
                                    <h4 class="font-semibold text-slate-900 text-sm">Ambiente Seguro</h4>
                                    <p class="text-sm text-slate-500 mt-1">Seus dados de saúde estão protegidos com criptografia de ponta a ponta, em conformidade com as normas de privacidade.</p>
                                </div>
                            </div>
                        </div>

                        <div class="relative z-10">
                            <p class="text-slate-500 text-sm font-medium">© 2026 CANA MED Mulher. Todos os direitos reservados.</p>
                        </div>
                    </div>

                    {/* Painel Direito (Área de Acesso/Autenticação) */}
                    <div class="w-full lg:w-[55%] xl:w-1/2 flex flex-col items-center justify-center p-6 md:p-12 lg:p-24 relative overflow-y-auto">
                        
                        {/* Header Mobile / Tablet (Logo) */}
                        <div class="lg:hidden absolute top-0 left-0 w-full p-6 flex justify-between items-center bg-white/80 backdrop-blur-md z-20 border-b border-slate-100">
                            <div class="flex items-center gap-2">
                                <div class="scale-75 origin-left"><Icons.Logo /></div>
                                <span class="text-lg font-bold tracking-tight text-brand-900">CANA MED</span>
                            </div>
                            <a href="#" class="text-xs font-medium text-slate-500 hover:text-brand-600">Ajuda</a>
                        </div>

                        {/* Wrapper de Transição Simples */}
                        <div class="w-full max-w-md mx-auto pt-16 lg:pt-0 relative min-h-[450px] flex flex-col justify-center">
                            {view === 'selection' ? (
                                <RoleSelector onSelect={handleSelectProfile} />
                            ) : (
                                <LoginForm profile={selectedProfile} onBack={handleBack} />
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
